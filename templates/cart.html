{% extends "base.html" %}
{% block content %}

<h2>Your Shopping Cart</h2>

<div class="card">
    <table class="table">
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th>
        </tr>

        {% for product, quantity in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>₹{{ product.price }}</td>

            <td>
                <form action="{{ url_for('update_cart', product_id=product.id) }}" method="POST">
                    <input type="number" name="quantity" value="{{ quantity }}" min="1">
                    <button type="submit">Update</button>
                </form>
            </td>

            <td>₹{{ product.price * quantity }}</td>

            <td>
                <a href="{{ url_for('remove_from_cart', product_id=product.id) }}">
                    <button>Remove</button>
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <div class="total-box">
        Grand Total: ₹{{ total }}
    </div>
</div>

{% endblock %}
